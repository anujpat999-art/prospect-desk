{% extends "base.html" %}
{% block title %}Admin sign in{% endblock %}
{% block body %}
<h1>Admin sign in</h1>
{% if err %}<div class="errors" role="alert">{{ err }}</div>{% endif %}
<form method="post" style="max-width:340px">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autofocus required></div>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
